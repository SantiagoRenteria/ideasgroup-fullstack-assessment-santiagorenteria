<div class="board-header flex justify-content-between align-items-center mb-4 gap-2 flex-wrap">
    <div class="flex align-items-center gap-3">
        <h5 class="m-0">{{ board?.projectName ?? 'Tablero' }}</h5>
        <span class="board-presence flex align-items-center gap-1 text-sm" *ngIf="connectedUsers.length" title="Conectados ahora">
            <i class="pi pi-circle-fill" style="font-size: 0.5rem; color: var(--green-500)"></i>
            {{ connectedUsers.join(', ') }}
        </span>
    </div>

    <div class="flex gap-2" *ngIf="board">
        <button
            pButton
            type="button"
            icon="pi pi-file-pdf"
            label="Reporte PDF"
            class="p-button-outlined p-button-sm"
            [loading]="downloadingReport === 'pdf'"
            (click)="downloadReport('pdf')"
        ></button>
        <button
            pButton
            type="button"
            icon="pi pi-file-excel"
            label="Reporte Excel"
            class="p-button-outlined p-button-sm"
            [loading]="downloadingReport === 'excel'"
            (click)="downloadReport('excel')"
        ></button>
    </div>
</div>

<div class="board-filters flex align-items-center gap-2 mb-4 flex-wrap" *ngIf="board">
    <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input type="text" pInputText placeholder="Buscar por título o descripción" [(ngModel)]="searchText" />
    </span>
    <p-dropdown
        [options]="users"
        optionLabel="name"
        optionValue="id"
        [(ngModel)]="filterAssigneeId"
        [showClear]="true"
        placeholder="Filtrar por responsable"
        appendTo="body"
    ></p-dropdown>
    <p-dropdown
        [options]="priorityOptions"
        optionLabel="label"
        optionValue="value"
        [(ngModel)]="filterPriority"
        [showClear]="true"
        placeholder="Filtrar por prioridad"
        appendTo="body"
    ></p-dropdown>
    <button
        pButton
        type="button"
        label="Limpiar filtros"
        class="p-button-text p-button-sm"
        *ngIf="isFiltering"
        (click)="clearFilters()"
    ></button>
</div>

<div class="board-columns" cdkDropListGroup *ngIf="board">
    <div class="board-column card" *ngFor="let column of board.columns; trackBy: trackByColumnId">
        <div class="board-column-header flex justify-content-between align-items-center mb-3">
            <span class="font-bold">{{ column.name }}</span>
            <span class="board-column-count">{{ getVisibleTasks(column).length }}</span>
        </div>

        <div
            class="board-column-tasks"
            cdkDropList
            [id]="column.id"
            [cdkDropListData]="column.tasks"
            [cdkDropListDisabled]="isFiltering"
            (cdkDropListDropped)="onDrop($event, column)"
        >
            <div
                class="board-task-card"
                *ngFor="let task of getVisibleTasks(column); trackBy: trackByTaskId"
                cdkDrag
                [cdkDragDisabled]="isFiltering"
                [cdkDragData]="task"
            >
                <div class="board-task-card-placeholder" *cdkDragPlaceholder></div>

                <div class="flex justify-content-between align-items-start gap-2">
                    <span class="board-task-title" (click)="openEditTask(task)">{{ task.title }}</span>
                    <div class="flex gap-1">
                        <button
                            pButton
                            type="button"
                            icon="pi pi-pencil"
                            class="p-button-text p-button-sm"
                            (click)="openEditTask(task)"
                        ></button>
                        <button
                            pButton
                            type="button"
                            icon="pi pi-trash"
                            class="p-button-text p-button-sm p-button-danger"
                            (click)="confirmDelete(task)"
                        ></button>
                    </div>
                </div>

                <p class="board-task-description">{{ task.description }}</p>

                <div class="flex justify-content-between align-items-center mt-2">
                    <p-tag [severity]="prioritySeverity[task.priority]" [value]="priorityLabels[task.priority]"></p-tag>
                </div>
            </div>
        </div>

        <button
            pButton
            type="button"
            icon="pi pi-plus"
            label="Agregar tarea"
            class="p-button-text w-full mt-2"
            (click)="openCreateTask(column.id)"
        ></button>
    </div>
</div>

<div class="text-center py-4" *ngIf="loading">Cargando tablero...</div>

<app-task-form
    [visible]="taskFormVisible"
    [task]="editingTask"
    [columnId]="targetColumnId"
    (visibleChange)="taskFormVisible = $event"
    (saved)="loadBoard()"
></app-task-form>
