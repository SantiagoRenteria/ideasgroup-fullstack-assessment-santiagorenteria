# index.html es el unico archivo sin hash en el nombre y es quien referencia los bundles
# hasheados, asi que nunca debe cachearse; el resto lleva hash de contenido (outputHashing:
# all), o sea que si cambia el contenido cambia la URL y puede cachearse indefinidamente.
# Sin esto, tras un redespliegue el navegador conserva un index.html viejo y sigue pidiendo
# bundles que ya no existen -- detectado depurando en real, no en teoria.
#
# Se resuelve con un map y no con add_header dentro de cada location a proposito: en nginx,
# un add_header en un bloque hijo descarta *todos* los heredados del padre, lo que dejaria
# las cabeceras de seguridad de abajo fuera de esas respuestas.
map $uri $cache_control {
    default        "public, max-age=31536000, immutable";
    ~/index\.html$ "no-cache, must-revalidate";
    ~^/$           "no-cache, must-revalidate";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Defensa en profundidad ante XSS/clickjacking: la unica proteccion previa era el
    # auto-escape de Angular en la interpolacion (sin innerHTML sin sanitizar en todo el
    # proyecto), pero eso es una sola capa. connect-src incluye ws:/wss: porque SignalR
    # negocia el handshake por HTTP antes de subir a WebSocket bajo el mismo origen.
    #
    # script-src sin 'unsafe-inline' obliga a desactivar la optimizacion inlineCritical de
    # Angular (ver frontend/angular.json): esa optimizacion difiere el CSS con un handler
    # inline onload="this.media='all'" que esta CSP bloquea, dejando las hojas en
    # media="print" y la app entera sin estilos. Se prefirio desactivar la optimizacion
    # antes que debilitar la CSP con 'unsafe-inline'.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
